services:
  wastewater-ai:
    build: .
    container_name: wastewater-ai
    ports:
      - "10000:10000"
    environment:
      MOCK_SENSOR: "true"
      SENSOR_SAVE_INTERVAL: "30"
      # Change this to your own long random string before deploying.
      SECRET_KEY: "change-me-to-a-long-random-string"
      DATABASE_URL: "sqlite:////app/data/wastewater.db"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
