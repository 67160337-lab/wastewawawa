<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Quality</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span>WA</span> Wastewater AI</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a class="active" href="water.html">Water Quality</a>
      <a href="prediction.html">AI Prediction</a>
      <a href="history.html">History</a>
      <a id="navAdmin" href="admin.html" style="display:none">Admin</a>
    </nav>
    <button class="logout" onclick="logout()">Logout</button>
  </aside>

  <main class="main">
    <header>
      <div>
        <p class="muted">Monitoring</p>
        <h2>Water Quality</h2>
      </div>
    </header>

    <!-- ส่วนฟอร์มบันทึกข้อมูล -->
    <section class="panel">
      <h3>บันทึกคุณภาพน้ำ</h3>
      <form id="waterForm" class="grid-form">
        <label>ค่า COD น้ำเข้า (Influent COD)<input id="cod" type="number" step="0.01" value="250.00" required></label>
        <label>อัตราการไหล (Flow Rate)<input id="flow" type="number" step="0.01" value="120.50" required></label>
        <label>อุณหภูมิน้ำ (Water Temperature)<input id="temp" type="number" step="0.01" value="28.50" required></label>
        <label>ค่าออกซิเจนละลายน้ำปัจจุบัน (Current DO)<input id="do" type="number" step="0.01" value="3.50" required></label>
        <button type="submit">บันทึกข้อมูล</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <!-- กราฟแนวโน้มค่าคุณภาพน้ำ -->
    <section class="panel" style="margin-top: 24px;">
      <div class="panel-title"><div><h3>แนวโน้มคุณภาพน้ำ</h3><p class="muted">COD, อัตราการไหล, อุณหภูมิ และ DO ตามช่วงเวลา</p></div></div>
      <div class="chart-wrap"><canvas id="waterChart" height="90"></canvas></div>
    </section>

    <!-- ส่วนแสดงประวัติการบันทึก (ย้ายออกมานอก form และตกแต่งตามตัวอย่าง) -->
    <section class="panel" style="margin-top: 24px; background-color: #f8fafc; padding: 24px; border-radius: 12px;">
      <div style="color: #64748b; font-size: 14px; margin-bottom: 4px;">ประวัติ</div>
      <h3 style="color: #0f172a; margin: 0 0 20px 0; font-size: 24px; font-weight: 700;">ประวัติคุณภาพน้ำ</h3>

      <div style="background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: hidden; padding: 12px 24px;">
        <table style="width: 100%; border-collapse: collapse; text-align: left;">
          <thead>
            <tr style="border-bottom: 1px solid #f1f5f9; color: #64748b; font-size: 13px; font-weight: 600;">
              <th style="padding: 16px 8px;">วันที่</th>
              <th style="padding: 16px 8px;">COD</th>
              <th style="padding: 16px 8px;">การไหล</th>
              <th style="padding: 16px 8px;">อุณหภูมิ</th>
              <th style="padding: 16px 8px;">DO</th>
              <th style="padding: 16px 8px;">สถานะ</th>
            </tr>
          </thead>
          <tbody id="waterHistoryBody" style="color: #334155; font-size: 14px;">
            <!-- ข้อมูลจาก Backend จะถูกนำมาแทรกตรงนี้ -->
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/api.js"></script>
<script src="js/water.js"></script>
</body>
</html>
