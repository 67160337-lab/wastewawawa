<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Prediction</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="layout"><aside class="sidebar">
<div class="brand"><span>WA</span> Wastewater AI</div>
<nav><a href="dashboard.html">Dashboard</a><a href="water.html">Water Quality</a><a class="active" href="prediction.html">AI Prediction</a><a href="history.html">History</a><a id="navAdmin" href="admin.html" style="display:none">Admin</a></nav>
<button class="logout" onclick="logout()">Logout</button>
</aside>
<main class="main"><header><div><p class="muted">แมชชีนเลิร์นนิง</p><h2>ทำนายความเร็วเครื่องเติมอากาศด้วย AI</h2></div></header>
<section class="panel">
<form id="predictionForm" class="grid-form">
<label>ค่า COD น้ำเข้า (Influent COD)<input id="cod" type="number" step="0.01" required></label>
<label>อัตราการไหล (Flow Rate)<input id="flow" type="number" step="0.01" required></label>
<label>อุณหภูมิน้ำ (Water Temperature)<input id="temp" type="number" step="0.01" required></label>
<label>ค่าออกซิเจนละลายน้ำปัจจุบัน (Current DO)<input id="do" type="number" step="0.01" required></label>
<button type="submit">ทำนายความเร็วเครื่องเติมอากาศ</button>
</form>
<div id="result" class="result hidden"><span>ความเร็วที่แนะนำ</span><strong id="speed">0%</strong></div>
<p id="message" class="message"></p>
</section></main></div>
<script src="js/api.js"></script><script src="js/prediction.js"></script>
</body></html>
